[project]
name = "prodcost-backend"
version = "0.1.0"
description = "Production cost calculator backend for CNC-focused metalworking quotes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.28",
  "python-dotenv>=1.2",
  "python-multipart>=0.0.20",
  "pypdf>=5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]
geometry = [
  "cadquery>=2.8"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

